; nginx y php-fpm son dos procesos y un contenedor solo tiene un PID 1.
; supervisor hace de PID 1 y, con autorestart=false, si cualquiera de los dos
; se cae el contenedor entero muere — que es lo que se quiere: la plataforma
; lo reinicia y el health check se entera. Un contenedor «vivo» con nginx
; muerto es peor que uno caído.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:salir_si_alguno_muere]
command=sh -c "printf 'READY\n'; while read line; do kill -SIGQUIT $PPID; done"
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
